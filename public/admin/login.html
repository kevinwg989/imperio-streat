<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | IMPÉRIO STREETWEAR</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="brand-logo" style="margin-bottom: 0.5rem;">
        <span class="logo-imperio">IMPÉRIO</span>
        <span class="logo-subtitle">STREETWEAR</span>
      </a>
      <h2 style="font-size: 1.1rem; text-transform: uppercase; color: var(--silver-accent); margin-top: 1rem;">
        Painel de Controle
      </h2>
      <p style="font-size: 0.8rem; color: var(--text-dim); margin-top: 4px;">
        Acesso restrito para gestão de pedidos, estoque e catálogo
      </p>
    </div>

    <div id="adminLoginError" class="toast toast-error" style="display: none; margin-bottom: 1.5rem; position: static;"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="adminLoginEmail">E-mail Administrativo</label>
        <input 
          type="email" 
          id="adminLoginEmail" 
          class="form-control" 
          placeholder="admin@imperio.local" 
          required 
          autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="adminLoginPass">Senha de Acesso</label>
        <input 
          type="password" 
          id="adminLoginPass" 
          class="form-control" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password">
      </div>

      <button type="submit" id="adminLoginBtn" class="btn btn-primary btn-block btn-lg">
        Acessar Painel
      </button>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="/" style="font-size: 0.78rem; color: var(--text-muted);">← Voltar para a Loja Virtual</a>
      </div>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
