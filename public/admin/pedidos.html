<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pedidos | Império Admin</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <a href="/admin" class="brand-logo">
        <span class="logo-imperio">IMPÉRIO</span>
        <span class="logo-subtitle">PAINEL ADMIN</span>
      </a>
    </div>

    <nav class="admin-nav">
      <a href="/admin" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Dashboard
      </a>
      <a href="/admin/pedidos" class="admin-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line></svg>
        Pedidos
      </a>
      <a href="/admin/produtos" class="admin-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        Produtos & Estoque
      </a>
      <a href="/" target="_blank" class="admin-nav-item" style="margin-top: auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Ver Loja Virtual ↗
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <button class="btn btn-outline btn-sm btn-block" onclick="handleAdminLogout()">Encerrar Sessão</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div>
        <h2 style="font-size: 1.15rem; text-transform: uppercase;">Acompanhamento de Pedidos</h2>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <label for="orderFilterStatus" style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600;">Filtrar:</label>
        <select id="orderFilterStatus" class="form-control" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.82rem;" onchange="loadAdminOrders(this.value)">
          <option value="todos">Todos os Pedidos</option>
          <option value="pendente">Pendentes</option>
          <option value="pago">Pagos (Aprovados)</option>
          <option value="em_separacao">Em Separação</option>
          <option value="enviado">Enviados</option>
          <option value="entregue">Entregues</option>
          <option value="cancelado">Cancelados</option>
        </select>
      </div>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h3>Lista de Transações & Envio</h3>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Cliente / Destino</th>
                <th>Total / Método</th>
                <th>Status do Pedido</th>
                <th>Data</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="adminOrdersTable">
              <!-- Preenchido via admin.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
